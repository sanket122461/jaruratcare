<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cancer Awareness & Support</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        /* Banner Section */
        .banner {
            background: url('https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?q=80') center/cover no-repeat;
            height: 60vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
            text-align: center;
        }

        .banner h1 {
            font-size: 38px;
            max-width: 700px;
            text-shadow: 2px 2px 10px black;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        /* Contact Form */
        form {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #d81b60;
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #ad1457;
        }

        /* Quote Box */
        .quote-box {
            background: #fff;
            padding: 20px;
            margin-top: 25px;
            border-radius: 10px;
            text-align: center;
            font-style: italic;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        footer {
            text-align: center;
            background: #333;
            color: white;
            padding: 15px;
            margin-top: 30px;
        }

        @media(max-width: 600px) {
            .banner h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <!-- Banner -->
    <div class="banner">
        <h1>Together We Fight Cancer – Awareness, Strength & Support</h1>
    </div>

    <div class="container">

        <h2>Contact Us</h2>

        <!-- Contact Form -->
        <form onsubmit="event.preventDefault(); alert('Form submitted (Demo Only)');">
            <input type="text" placeholder="Enter Name" required>
            <input type="email" placeholder="Enter Email" required>
            <textarea rows="5" placeholder="Enter Message" required></textarea>
            <button type="submit">Submit</button>
        </form>

        <!-- Real-Time Quote -->
        <div class="quote-box" id="quoteBox">
            Fetching inspirational quote...
        </div>

    </div>

    <footer>
        © 2025 Cancer Awareness & Support | All Rights Reserved
    </footer>

    <script>
        // Working Quote API
        async function getQuote() {
            try {
                let res = await fetch("https://api.quotable.io/random");
                let data = await res.json();
                document.getElementById("quoteBox").innerText =
                    `"${data.content}" — ${data.author}`;
            } catch {
                document.getElementById("quoteBox").innerText =
                    "Unable to load quote.";
            }
        }

        getQuote();
    </script>

</body>
</html>
